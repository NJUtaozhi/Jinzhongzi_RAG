  "paths": {
    "/v1/agent/analyze": {
      "post": {
        "summary": "多模态情绪分析和决策",
        "deprecated": false,
        "description": "",
        "tags": [],
        "parameters": [],
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "image": {
                    "format": "binary",
                    "type": "string",
                    "description": "用户上传的人脸图片",
                    "example": ""
                  },
                  "text": {
                    "description": "用户输入的文本，从中应能隐式或者显式捕捉到情绪信号",
                    "example": "寻寻觅觅冷冷清清凄凄惨惨戚戚，乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌它，晚来风急，雁过也，正伤心，却是旧时相识。",
                    "type": "string"
                  },
                  "user_id": {
                    "description": "用户唯一标识，用于记录历史",
                    "example": "{{$string.uuid}}",
                    "type": "string"
                  }
                },
                "required": [
                  "text"
                ]
              },
              "example": {
                "image": "",
                "text": "寻寻觅觅冷冷清清凄凄惨惨戚戚，乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌它，晚来风急，雁过也，正伤心，却是旧时相识。",
                "user_id": "{{$string.uuid}}"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "integer"
                    },
                    "msg": {
                      "type": "string"
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "analysis": {
                          "type": "object",
                          "properties": {
                            "image_emotion": {
                              "type": "object",
                              "properties": {
                                "dominant_emotion": {
                                  "type": "string"
                                },
                                "au12_r_smile_intensity": {
                                  "type": "number"
                                },
                                "au04_r_brow_lower": {
                                  "type": "number"
                                }
                              },
                              "required": [
                                "dominant_emotion",
                                "au12_r_smile_intensity",
                                "au04_r_brow_lower"
                              ]
                            },
                            "text_sentiment": {
                              "type": "string"
                            },
                            "text_keywords": {
                              "type": "array",
                              "items": {
                                "type": "string"
                              }
                            }
                          },
                          "required": [
                            "image_emotion",
                            "text_sentiment",
                            "text_keywords"
                          ]
                        },
                        "decision": {
                          "type": "string"
                        },
                        "reply": {
                          "type": "string"
                        },
                        "advice_source": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "analysis",
                        "decision",
                        "reply",
                        "advice_source"
                      ]
                    }
                  },
                  "required": [
                    "code",
                    "msg",
                    "data"
                  ]
                },
                "example": {
                  "code": 200,
                  "msg": "success",
                  "data": {
                    "analysis": {
                      "image_emotion": {
                        "dominant_emotion": "sadness",
                        "au12_r_smile_intensity": 0.2,
                        "au04_r_brow_lower": 1.8
                      },
                      "text_sentiment": "negative",
                      "text_keywords": [
                        "焦虑",
                        "压力"
                      ]
                    },
                    "decision": "need_knowledge",
                    "reply": "听起来你有些焦虑，这是很常见的情绪。研究表明，适度运动可以有效缓解焦虑情绪。",
                    "advice_source": "从知识库检索到的心理学论文摘要"
                  }
                }
              }
            },
            "headers": {}
          },
          "400": {
            "$ref": "#/components/responses/参数缺失",
            "description": "请求参数不全"
          }
        },
        "security": []
      }
    },
    "/chat": {
      "post": {
        "summary": "单轮心理健康辅导对话（JSON）",
        "deprecated": false,
        "description": "纯文本对话入口，返回完整 JSON 响应。带图请求请走 /v1/agent/analyze (multipart)。",
        "tags": [],
        "parameters": [],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "query": {
                    "type": "string",
                    "description": "用户输入文本",
                    "minLength": 1
                  },
                  "session_id": {
                    "type": "string",
                    "description": "会话 ID（多轮对话追踪）",
                    "default": "default"
                  },
                  "history": {
                    "type": "array",
                    "description": "对话历史",
                    "items": {
                      "type": "object",
                      "properties": {
                        "role": {
                          "type": "string",
                          "enum": ["user", "assistant"]
                        },
                        "content": {
                          "type": "string"
                        }
                      }
                    }
                  },
                  "image_path": {
                    "type": "string",
                    "description": "可选：面部图像文件路径"
                  },
                  "max_iterations": {
                    "type": "integer",
                    "description": "ReAct 最大迭代次数",
                    "minimum": 1,
                    "maximum": 20,
                    "default": 8
                  }
                },
                "required": ["query"]
              },
              "example": {
                "query": "我最近总是睡不着，一闭眼就想很多事",
                "session_id": "user-001",
                "history": [],
                "max_iterations": 8
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "对话成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "answer": {
                      "type": "string",
                      "description": "Agent 最终回复"
                    },
                    "status": {
                      "type": "string",
                      "enum": ["completed", "failed"]
                    },
                    "intent": {
                      "type": "string",
                      "description": "识别的用户意图"
                    },
                    "emotion": {
                      "type": "string",
                      "description": "识别的情绪标签"
                    },
                    "react_trace": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      },
                      "description": "ReAct 审计轨迹"
                    },
                    "session_id": {
                      "type": "string",
                      "description": "会话 ID"
                    }
                  },
                  "required": ["answer", "status", "intent", "emotion", "react_trace", "session_id"]
                }
              }
            }
          }
        },
        "security": []
      }
    },
    "/chat/stream": {
      "post": {
        "summary": "流式心理健康辅导对话（SSE）",
        "deprecated": false,
        "description": "与 /chat 相同语义，但使用 Server-Sent Events 流式推送状态更新和回复分块。",
        "tags": [],
        "parameters": [],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/paths/~1chat/post/requestBody/content/application~1json/schema"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "SSE 事件流",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string",
                  "description": "事件类型: status（状态更新）、reply_chunk（回复分块）、done（完成）、error（错误）"
                },
                "example": "data: {\"type\":\"status\",\"status\":\"reasoning\",\"trace\":[]}\n\ndata: {\"type\":\"reply_chunk\",\"content\":\"我理解你的感受...\"}\n\ndata: {\"type\":\"done\",\"emotion\":\"anxiety\",\"intent\":\"seeking_emotional_support\"}\n\n"
              }
            }
          }
        },
        "security": []
      }
    },
    "/v1/knowledge/retrieve": {
      "post": {
        "summary": "心理学知识语义检索",
        "deprecated": false,
        "description": "",
        "tags": [],
        "parameters": [],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "query": {
                    "type": "string",
                    "description": "检索查询语句，由Agent根据用户输入生成"
                  },
                  "top_k": {
                    "type": "integer",
                    "description": "返回最相关的知识片段条数，默认为1"
                  }
                },
                "required": [
                  "query"
                ]
              },
              "example": {
                "query": "感到焦虑和压力大时应该如何应对",
                "top_k": 1
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "integer",
                      "description": "业务状态码，200表示成功"
                    },
                    "msg": {
                      "type": "string",
                      "description": "响应信息，\"success\"表示成功"
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "results": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "properties": {
                              "score": {
                                "type": "number",
                                "description": "相关性评分，0~1之间"
                              },
                              "source": {
                                "type": "string",
                                "description": "知识来源（论文/书籍/报告名称）"
                              },
                              "content": {
                                "type": "string",
                                "description": "知识片段的具体内容"
                              }
                            },
                            "required": [
                              "score",
                              "source",
                              "content"
                            ]
                          },
                          "description": "检索结果列表，按相关性从高到低排列"
                        }
                      },
                      "description": "响应数据主体",
                      "required": [
                        "results"
                      ]
                    }
                  },
                  "required": [
                    "code",
                    "msg",
                    "data"
                  ]
                },
                "example": {
                  "code": 200,
                  "msg": "success",
                  "data": {
                    "results": [
                      {
                        "content": "多项研究表明，正念冥想、规律的有氧运动（如跑步、游泳）以及建立稳定的社会支持网络，是缓解焦虑和压力的有效行为策略。",
                        "source": "《大学生压力应对方式与心理健康的关系研究》，2020，心理学报。",
                        "score": 0.92
                      }
                    ]
                  }
                }
              }
            },
            "headers": {}
          },
          "400": {
            "description": "",
            "content": {
              "application/json": {
                "schema": {
                  "title": "",
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "integer",
                      "description": "业务错误码，用于标识具体错误类型。40001 表示“query参数为空”"
                    },
                    "msg": {
                      "type": "string",
                      "description": "用户友好的错误描述信息，可直接展示给用户或用于日志记录"
                    },
                    "data": {
                      "type": "null",
                      "description": "错误时无数据返回，固定为 null"
                    }
                  },
                  "required": [
                    "code",
                    "msg",
                    "data"
                  ]
                },
                "example": {
                  "code": 40001,
                  "msg": "query参数不能为空，请提供有效的检索语句",
                  "data": null
                }
              }
            },
            "headers": {}
          }
        },
        "security": []
      }
    },
